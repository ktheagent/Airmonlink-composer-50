name: Build Windows Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  npm_config_registry: https://registry.npmjs.org/
jobs:
  validate:
    name: Validate source and browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Version consistency gate
        run: npm run version:check
      - name: Validate workflow YAML
        run: npm run workflow:check
      - name: Lint JavaScript
        run: npm run lint
      - name: Run source tests
        run: npm test
      - name: Run Build 50 command/control audit
        run: npm run audit:build50
      - name: Run performance gates
        run: npm run performance
      - name: Build browser preview
        run: npm run preview
      - name: Run browser interaction validation
        run: npm run browser-smoke
      - name: Run viewport matrix
        run: npm run viewport-matrix
      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Composer-Build50-Linux-Validation-${{ github.run_number }}
          path: validation/**
          if-no-files-found: warn
          retention-days: 14
  build-windows:
    name: Compile and smoke-test Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Export authoritative Build 50 metadata
        shell: pwsh
        run: |
          $m = Get-Content release-metadata.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($m.appVersion)" | Add-Content $env:GITHUB_ENV
          "BUILD_NUMBER=$($m.buildNumber)" | Add-Content $env:GITHUB_ENV
          "BUILD_VERSION=$($m.buildVersion)" | Add-Content $env:GITHUB_ENV
          "PRODUCT_SLUG=$($m.productSlug)" | Add-Content $env:GITHUB_ENV
          "SETUP_FILE=$($m.setupFile)" | Add-Content $env:GITHUB_ENV
          "PORTABLE_FILE=$($m.portableFile)" | Add-Content $env:GITHUB_ENV
          "INSTALL_DIRECTORY=$($m.installDirectory)" | Add-Content $env:GITHUB_ENV
      - name: Version consistency gate on Windows
        shell: pwsh
        run: npm run version:check
      - name: Validate workflow YAML on Windows
        shell: pwsh
        run: npm run workflow:check
      - name: Lint JavaScript on Windows
        shell: pwsh
        run: npm run lint
      - name: Run source tests on Windows
        shell: pwsh
        run: npm test
      - name: Run Build 50 command/control audit on Windows
        shell: pwsh
        run: npm run audit:build50
      - name: Run performance gates on Windows
        shell: pwsh
        run: npm run performance
      - name: Build browser preview on Windows
        shell: pwsh
        run: npm run preview
      - name: Build Setup and Portable executables
        shell: pwsh
        run: npm run dist:win
      - name: Verify Windows release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path "release" $env:SETUP_FILE
          $portable = Join-Path "release" $env:PORTABLE_FILE
          foreach ($file in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing expected Build $env:BUILD_NUMBER artifact: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 1MB) { throw "Artifact is unexpectedly small: $file" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $file))
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Artifact is not a Windows PE file: $file" }
          }
          $ii=(Get-Item $installer).VersionInfo; $pi=(Get-Item $portable).VersionInfo
          [ordered]@{appVersion=$env:APP_VERSION;buildNumber=[int]$env:BUILD_NUMBER;buildVersion=$env:BUILD_VERSION;installer=@{filename=$env:SETUP_FILE;size=(Get-Item $installer).Length;product=$ii.ProductName;version=$ii.ProductVersion};portable=@{filename=$env:PORTABLE_FILE;size=(Get-Item $portable).Length;product=$pi.ProductName;version=$pi.ProductVersion}} | ConvertTo-Json -Depth 5 | Set-Content release/WINDOWS-ARTIFACT-VERIFICATION.json
      - name: Silent install and bounded startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer=(Resolve-Path (Join-Path "release" $env:SETUP_FILE)).Path
          $portable=(Resolve-Path (Join-Path "release" $env:PORTABLE_FILE)).Path
          $installDir=Join-Path $env:RUNNER_TEMP $env:INSTALL_DIRECTORY
          if(Test-Path $installDir){Remove-Item $installDir -Recurse -Force}
          $install=Start-Process $installer -ArgumentList @("/S","/D=$installDir") -PassThru -Wait
          if($install.ExitCode -ne 0){throw "Silent installer returned $($install.ExitCode)"}
          $installed=Get-ChildItem $installDir -Filter "*.exe" -Recurse -File | Where-Object {$_.Name -notmatch '(?i)^uninstall'} | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $installed){throw "Installed application executable was not found"}
          function Test-Launch([string]$Path,[string]$Label){$p=Start-Process $Path -ArgumentList "--build-smoke-test" -PassThru;Start-Sleep 8;if($p.HasExited){throw "$Label exited with $($p.ExitCode)"};Stop-Process $p.Id -Force}
          Test-Launch $installed.FullName "Installed application"
          Test-Launch $portable "Portable application"
          [ordered]@{installerExitCode=$install.ExitCode;installedExecutable=$installed.FullName;installedStartup="passed";portableExecutable=$portable;portableStartup="passed"} | ConvertTo-Json | Set-Content release/WINDOWS-SMOKE-RESULT.json
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Remove-Item release/SHA256SUMS.txt -ErrorAction SilentlyContinue
          Get-ChildItem release -File | Where-Object {$_.Name -ne "SHA256SUMS.txt"} | Sort-Object Name | ForEach-Object {"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" | Add-Content release/SHA256SUMS.txt}
      - name: Write Build Summary
        shell: pwsh
        run: |
          "## Airmonlink Composer Windows Build`n- Version: $env:APP_VERSION`n- Build: $env:BUILD_NUMBER`n- Build version: $env:BUILD_VERSION`n- Setup: $env:SETUP_FILE`n- Portable: $env:PORTABLE_FILE`n- Installer verification: passed`n- Portable verification: passed" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Composer-Build50-Windows-Validation-${{ github.run_number }}
          path: |
            validation/**
            release/WINDOWS-ARTIFACT-VERIFICATION.json
            release/WINDOWS-SMOKE-RESULT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Airmonlink-Composer-Build50-Windows-${{ github.run_number }}
          path: |
            release/Airmonlink-Composer-1.3.0-Build50-Setup.exe
            release/Airmonlink-Composer-1.3.0-Build50-Portable.exe
            release/SHA256SUMS.txt
            release/WINDOWS-ARTIFACT-VERIFICATION.json
            release/WINDOWS-SMOKE-RESULT.json
          if-no-files-found: error
          retention-days: 30
